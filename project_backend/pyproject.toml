[project]
name = "automl-studio-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "fastapi[standard]>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "PyJWT>=2.8,<3",
    "passlib[argon2]>=1.7.4,<2",
    "email-validator>=2.1,<3",
    "Authlib>=1.3,<2",
    "httpx>=0.27,<1",
    "itsdangerous>=2.1,<3",
]

[tool.fastapi]
entrypoint = "app.main:app"
